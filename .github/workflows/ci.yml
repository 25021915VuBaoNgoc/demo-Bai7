name: Automated Code Review

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  code-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Tests
        run: mvn test --no-transfer-progress

      - name: Run Checkstyle
        run: mvn checkstyle:check --no-transfer-progress


      - name: Post inline comments on PR
        uses: dbelyaev/action-checkstyle@v1.5.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          checkstyle_config: checkstyle/checkstyle.xml
          fail_on_error: true